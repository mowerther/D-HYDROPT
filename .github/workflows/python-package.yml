name: tests

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt carries jax, which the previous workflow omitted --
          # so the hydropt_jax tests could never have run here.
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Lint
        run: |
          # Syntax errors and undefined names fail the build.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=versioneer.py,hydropt/_version.py
          # Everything else is advisory.
          flake8 . --count --exit-zero --max-complexity=12 --max-line-length=100 \
            --statistics --exclude=versioneer.py,hydropt/_version.py

      - name: Test
        run: pytest -v --cov=hydropt --cov=hydropt_jax --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
